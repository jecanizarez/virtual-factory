version: '3.3'
services:
  hmi:
    build: ./FUXA-HMI
    ports:
      - 1881:1881
    volumes:
      - ./simulators/flamingmoes/fuxa:/usr/src/app/FUXA/config
    entrypoint:
      - bash
      - entrypoint.sh
    networks:
      - ot
      - oraculo
    depends_on:
      - openplc
      - mosquitto
  openplc:
    build: ./OpenPLC/
    ports:
      - 502:502
      - 8080:8080
    volumes:
      - ./simulators/flamingmoes/openplc:/OpenPLC_v3/scripts/
    entrypoint:
      - bash
      - entrypoint.sh
    networks:
      - ot
      - oraculo
  mosquitto:
    image: eclipse-mosquitto
    ports:
      - 1883:1883
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - simulators
      - oraculo
  tequila:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/tequila.json
    networks:
      - ot
      - simulators
    depends_on:
      - openplc
      - mosquitto
  tequilavalve:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/tequilavalve.json
    networks:
      - ot
      - simulators
    depends_on:
      - tequila
      - openplc
      - mosquitto
      - opensearch
  peppermint:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/peppermint.json
    networks:
      - ot
      - simulators
    depends_on:
      - openplc
      - mosquitto
  peppermintvalve:
