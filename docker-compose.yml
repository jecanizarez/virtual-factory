      - flamingmoes/mintcreamvalve.json
    networks:
      - ot
      - simulators
    depends_on:
      - mintcream
      - openplc
      - mosquitto
      - opensearch
  brandy:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/brandy.json
    networks:
      - ot
      - simulators
    depends_on:
      - openplc
      - mosquitto
  brandyvalve:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
