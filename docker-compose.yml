  conveyorbelt:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
      - ./simulation_logs/:/home/logs/test
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/conveyorbelt1.json
    networks:
      - ot
      - simulators
    depends_on:
      - recolectorvalve
      - openplc
      - mosquitto
      - opensearch
  buggable-cli:
    image: python:3.9-slim
    volumes:
      - ./buggable-cli/app:/usr/src/app
    working_dir: /usr/src/app
    environment:
      - MQTT_BROKER=mosquitto
    entrypoint:
      - sh
      - entrypoint.sh
      - anomalies.json
    networks:
      - simulators
    depends_on:
      - mosquitto
  docker-stats-logger:
    build: ./docker-stats-logger
    volumes:
      - ./docker-stats-logger/logs:/usr/src/app/stats_logs/
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOCKER_PROJECT=syp-poc-fabrica-virtual
      - LOGGING_ONE_SHOT=f
      - LOGGING_WAIT=15
      - LOGGING_EXCLUDE=syp-poc-fabrica-virtual_docker-stats-logger_1
  flamingmoesprocess:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/flamingmoesprocess.json
    networks:
      - ot
      - simulators
    depends_on:
      - openplc
      - mosquitto
  opensearch:
    image: opensearchproject/opensearch:1.3.1
    env_file:
      - opensearch/opensearch.env
    volumes:
      - ./data:/usr/share/opensearch/data
    ports:
      - 9200:9200/tcp
      - 9300:9300/tcp
    networks:
      - simulators
      - oraculo
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:1.3.1
    ports:
      - 5601:5601
    env_file:
      - opensearch/opensearchdashboards.env
    networks:
      - simulators
    depends_on:
      - opensearch
  # CAI pentest agent (Cybersecurity AI framework).
  # Start standalone:  docker compose up -d cai
  # Attach:            docker compose exec -it cai cai "your prompt"
  cai:
    build: ./cai
    stdin_open: true
    tty: true
    command: /bin/sh -c "while sleep 3600; do :; done"
    env_file:
      - path: cai/.env
        required: false
    volumes:
      - ./cai/workspace:/root/.cai
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    privileged: true
    networks:
      - ot
      - simulators
  # Oraculo factory assistant (read-only Q&A + configuration verification).
  # Start standalone:   docker compose up -d oraculo
  # Interactive REPL:   docker compose exec -it oraculo oraculo
  # One-shot question:  docker compose exec -T oraculo oraculo "your question"
  # Isolated on its own network: cai and students cannot reach it.
  oraculo:
    build: ./oraculo
    stdin_open: true
    tty: true
    env_file:
      - path: oraculo/.env
        required: false
    volumes:
      - ./FACTORY.md:/app/knowledge/factory.md:ro
      - ./oraculo/knowledge/lab_guide.md:/app/knowledge/lab_guide.md:ro
      - ./README.md:/app/knowledge/readme.md:ro
      - ./OpenPLC/README.md:/app/knowledge/openplc_readme.md:ro
      - ./FUXA-HMI/README.md:/app/knowledge/fuxa_hmi_readme.md:ro
      - ./buggable-cli/README.md:/app/knowledge/buggable_cli_readme.md:ro
      - ./mosquitto/mosquitto.conf:/app/knowledge/mosquitto.conf:ro
      - ./simulators/flamingmoes:/app/knowledge/flamingmoes:ro
    networks:
      - oraculo
networks:
  ot:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br_ot_network
  simulators:
    driver: bridge
  oraculo:
    driver: bridge
