version: '3.3'
services:
  hmi:
    build: ./FUXA-HMI
    ports:
      - 1881:1881
    volumes:
      - ./simulators/flamingmoes/fuxa:/usr/src/app/FUXA/config
    entrypoint:
      - bash
      - entrypoint.sh
    networks:
      - ot
    depends_on:
      - openplc
      - mosquitto
  openplc:
    build: ./OpenPLC/
    ports:
      - 502:502
      - 8080:8080
    volumes:
      - ./simulators/flamingmoes/openplc:/OpenPLC_v3/scripts/
    entrypoint:
      - bash
      - entrypoint.sh
    networks:
      - ot
  mosquitto:
    image: eclipse-mosquitto
    ports:
      - 1883:1883
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - simulators
  tequila:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/tequila.json
    networks:
      - ot
      - simulators
    depends_on:
      - openplc
      - mosquitto
  tequilavalve:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/tequilavalve.json
    networks:
      - ot
      - simulators
    depends_on:
      - tequila
      - openplc
      - mosquitto
      - opensearch
  peppermint:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/peppermint.json
    networks:
      - ot
      - simulators
    depends_on:
      - openplc
      - mosquitto
  peppermintvalve:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/peppermintvalve.json
    networks:
      - ot
      - simulators
    depends_on:
      - peppermint
      - openplc
      - mosquitto
      - opensearch
  mintcream:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/mintcream.json
    networks:
      - ot
      - simulators
    depends_on:
      - openplc
      - mosquitto
  mintcreamvalve:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/mintcreamvalve.json
    networks:
      - ot
      - simulators
    depends_on:
      - mintcream
      - openplc
      - mosquitto
      - opensearch
  brandy:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/brandy.json
    networks:
      - ot
      - simulators
    depends_on:
      - openplc
      - mosquitto
  brandyvalve:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/brandyvalve.json
    networks:
      - ot
      - simulators
    depends_on:
      - brandy
      - openplc
      - mosquitto
      - opensearch
  gin:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/gin.json
    networks:
      - ot
      - simulators
    depends_on:
      - openplc
      - mosquitto
  ginvalve:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/ginvalve.json
    networks:
      - ot
      - simulators
    depends_on:
      - gin
      - openplc
      - mosquitto
      - opensearch
  coughsyrup:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/coughsyrup.json
    networks:
      - ot
      - simulators
    depends_on:
      - openplc
      - mosquitto
  coughsyrupvalve:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/coughsyrupvalve.json
    networks:
      - ot
      - simulators
    depends_on:
      - coughsyrup
      - openplc
      - mosquitto
      - opensearch
  mixtank1:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/mixtank1.json
    networks:
      - ot
      - simulators
    depends_on:
      - tequilavalve
      - peppermintvalve
      - mintcreamvalve
      - openplc
      - mosquitto
      - opensearch
  mixtank1valve:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
      - ./simulation_logs/:/home/logs
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/mixtank1valve.json
    networks:
      - ot
      - simulators
    depends_on:
      - mixtank1
      - openplc
      - mosquitto
      - opensearch
  mixtank2:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
      - ./simulation_logs/:/home/logs
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/mixtank2.json
    networks:
      - ot
      - simulators
    depends_on:
      - brandyvalve
      - ginvalve
      - coughsyrupvalve
      - openplc
      - mosquitto
      - opensearch
  mixtank2valve:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/mixtank2valve.json
    networks:
      - ot
      - simulators
    depends_on:
      - mixtank2
      - openplc
      - mosquitto
      - opensearch
  recolector:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/recolector.json
    networks:
      - ot
      - simulators
    depends_on:
      - mixtank1valve
      - mixtank2valve
      - openplc
      - mosquitto
      - opensearch
  recolectorvalve:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/recolectorvalve.json
    networks:
      - ot
      - simulators
    depends_on:
      - recolector
      - openplc
      - mosquitto
      - opensearch
  drain:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/drain.json
    networks:
      - ot
      - simulators
    depends_on:
      - conveyorbelt
      - openplc
      - mosquitto
      - opensearch
  conveyorbelt:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
      - ./simulation_logs/:/home/logs/test
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/conveyorbelt1.json
    networks:
      - ot
      - simulators
    depends_on:
      - recolectorvalve
      - openplc
      - mosquitto
      - opensearch
  buggable-cli:
    image: python:3.9-slim
    volumes:
      - ./buggable-cli/app:/usr/src/app
    working_dir: /usr/src/app
    environment:
      - MQTT_BROKER=mosquitto
    entrypoint:
      - sh
      - entrypoint.sh
      - anomalies.json
    networks:
      - simulators
    depends_on:
      - mosquitto
  docker-stats-logger:
    build: ./docker-stats-logger
    volumes:
      - ./docker-stats-logger/logs:/usr/src/app/stats_logs/
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOCKER_PROJECT=syp-poc-fabrica-virtual
      - LOGGING_ONE_SHOT=f
      - LOGGING_WAIT=15
      - LOGGING_EXCLUDE=syp-poc-fabrica-virtual_docker-stats-logger_1
  flamingmoesprocess:
    image: python:3.9-slim
    volumes:
      - ./simulators:/usr/src/app
    working_dir: /usr/src/app
    entrypoint:
      - sh
      - entrypoint.sh
      - flamingmoes/flamingmoesprocess.json
    networks:
      - ot
      - simulators
    depends_on:
      - openplc
      - mosquitto
  opensearch:
    image: opensearchproject/opensearch:1.3.1
    env_file:
      - opensearch/opensearch.env
    volumes:
      - ./data:/usr/share/opensearch/data
    ports:
      - 9200:9200/tcp
      - 9300:9300/tcp
    networks:
      - simulators
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:1.3.1
    ports:
      - 5601:5601
    env_file:
      - opensearch/opensearchdashboards.env
    networks:
      - simulators
    depends_on:
      - opensearch
networks:
  ot:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br_ot_network
  simulators:
    driver: bridge
